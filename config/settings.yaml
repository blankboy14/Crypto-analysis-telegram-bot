# settings.yaml
# Central config for the bot. Secrets (bot token, API keys) live in
# .env instead - this file is for tunable numbers/behaviour only, and
# is safe to commit to git.

analysis:
  min_ticks_before_analysis: 5
  max_history_per_symbol: 300

indicators:
  rsi:
    period: 14
    overbought: 70
    oversold: 30
  ema:
    fast_period: 9
    slow_period: 21
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  bollinger:
    period: 20
    num_std: 2
  support_resistance:
    lookback: 50

risk_management:
  stop_loss_pct_of_range: 0.30
  take_profit_pct_of_range: 0.60
  fallback_range_pct: 0.01
  # --- stop-loss trailing (fixes "hit TP1/TP2 then reversed all the way
  # to the ORIGINAL stop" - previously the stop never moved once a
  # trade was opened, so a trade that reached a target could still give
  # back the entire risk). Applied by jobs/signal_outcome_tracker.py. ---
  # Once TP1 is reached, move the stop to the entry price - the trade
  # can no longer close as a full loss, worst case is a scratch.
  move_stop_to_breakeven_after_tp1: true
  # Once TP2 is reached, move the stop up to TP1 - locks in at least
  # the TP1 gain instead of only breakeven.
  move_stop_to_tp1_after_tp2: true

signal_scoring:
  buy_threshold: 2
  sell_threshold: -2

# --- Phase 2.1: "24/7 Market Analyse" volume-spike watcher ---
volume_spike_watch:
  # Was 15 SECONDS - every 4 ticks a minute, across every pair on the
  # exchange, is a real over-hit risk on Bitget's rate limits. 300 (5
  # minutes) is still frequent enough to catch a genuine move quickly,
  # at a fraction of the API load.
  poll_interval_seconds: 300
  # % move within one poll window that counts as "suddenly moving" for
  # a normal pair (per the spec: e.g. 20-40% in a short burst).
  spike_pct_threshold: 20.0
  # BTC gets a separate, much tighter threshold since the spec calls
  # out that BTC essentially never does 20-40% moves - a smaller move
  # is already noteworthy for it.
  btc_spike_pct_threshold: 5.0
  btc_symbol: "BTCUSDT"
  # Don't re-alert the same pair/direction again within this window.
  cooldown_seconds: 900
  # --- volume burst add-on (real traded volume, not price) ---
  # DISABLED by default - this "N times its own baseline" check can
  # fire on trivial pairs (e.g. $38 -> $3,909 reads as "102x!" but is a
  # meaningless dollar amount) and was replaced by absolute_volume_watch
  # below, which instead requires a real, fixed USDT amount regardless
  # of what "normal" looks like for that pair. Set to true to bring
  # this back alongside absolute_volume_watch if both are wanted.
  volume_burst_enabled: false
  # A pair's traded volume this interval must be at least this many
  # times its own recent baseline to count as a "burst".
  volume_burst_multiplier: 5.0
  # Need at least this many prior interval samples before a baseline
  # is trusted enough to compare against (avoids flagging on noise
  # while a pair is still "warming up").
  volume_burst_min_samples: 5
  # If > 0, only alert bursts where the pair's baseline interval
  # volume was at/below this (USDT) - i.e. it really was quiet before.
  # 0 disables the filter and considers every pair regardless of size.
  volume_burst_low_floor_usdt: 0

# --- 24/7 Market Analyse add-on #1: ABSOLUTE volume burst ---
# Separate from volume_spike_watch's "N times its own baseline" check
# above - this instead flags a pair the moment its traded volume
# crosses a fixed absolute USDT amount within a rolling window,
# regardless of what "normal" is for that pair (e.g. a pair that
# usually does ~100k/interval suddenly trading 60M+ within 30 minutes).
absolute_volume_watch:
  enabled: true
  # The rolling comparison window - "X+ within THIS many seconds".
  window_seconds: 1800  # 30 minutes
  # Separate bars for a main coin (BTC/ETH/SOL/BNB - see
  # main_coin_watch.symbols below, shared by both features so the
  # "which pairs count as major" list only lives in one place) vs
  # everything else (treated as a meme/alt coin). A meme coin's
  # normal volume is usually far smaller, so in absolute-dollar terms
  # its bar is set HIGHER, not lower - $200M actually moving through a
  # small-cap pair in 30 minutes is a much rarer, more extreme event
  # than the same dollar amount on BTC.
  main_coin_threshold_usdt: 80000000  # 80,000,000 USDT
  meme_coin_threshold_usdt: 200000000  # 200,000,000 USDT
  # Ticks aren't always perfectly spaced (a bot hiccup, a chat joining
  # mid-cycle, etc.), so the ACTUAL elapsed time between "now" and the
  # sample being compared against is measured every time and the
  # threshold is scaled to match it (e.g. if the real gap ended up
  # being 42 minutes instead of 30, the bar to clear scales up
  # proportionally) - this is what keeps "X+ within Y minutes"
  # meaningful even if window_seconds above gets edited later or a
  # tick lands late, instead of silently comparing against the wrong
  # timeframe.
  cooldown_seconds: 1800

# --- 24/7 Market Analyse add-on #2: daily reset big-mover ---
# Once a day, at reset_hour_utc, this remembers each pair's price as
# that day's baseline; if a pair's price is ever move_threshold_pct+
# away from ITS OWN day-start price before the next reset, it's
# flagged - a slower-moving companion to the 24h%-change ticker field,
# since 24h% is a rolling window that doesn't line up with any fixed
# clock time. reset_hour_utc: 0 = 00:00 UTC = 06:00 in Bangladesh
# (UTC+6) - adjust if the "daily reset" should land at a different
# local time.
daily_mover_watch:
  # DISABLED - superseded by main_coin_watch / meme_coin_watch below,
  # which check the exchange's own rolling 24h% field directly instead
  # of a once-a-day reset baseline. Left in place (not deleted) in
  # case the "since a fixed daily reset time" behaviour is ever wanted
  # again alongside the new watchers - the two don't conflict.
  enabled: false
  reset_hour_utc: 0
  up_threshold_pct: 60.0
  down_threshold_pct: 40.0

# --- 24/7 Market Analyse add-on #3: per-pair volatility tiers ---
# DISABLED - superseded by main_coin_watch below, which checks the
# same idea (major pairs need a much tighter bar than everyone else)
# directly off the 24h% field instead of a custom candle calculation.
# Left in place, not deleted, in case the candle-confirmed version is
# ever wanted back.
volatility_tier_watch:
  enabled: false
  refresh_seconds: 60
  cooldown_seconds: 1800
  tiers:
    - symbols: ["BTCUSDT"]
      pct_threshold: 3.0
      candle_interval: "30m"
      min_candle_volume_usdt: 10000
    - symbols: ["ETHUSDT", "SOLUSDT"]
      pct_threshold: 5.0
      candle_interval: "1m"
      min_candle_volume_usdt: 1000000

# --- 24/7 Market Analyse add-on #4: Main Coin 24h% watch ---
# The exchange's own rolling 24h% change field (no candle math, no
# warm-up period needed - it's read straight off the ticker) for a
# small, fixed list of major pairs. These rarely move more than a
# couple % a day, so a much tighter bar than a normal/meme pair
# already matters. `symbols` here is ALSO what main_coin_watch and
# meme_coin_watch (below) and absolute_volume_watch (above) all use to
# decide "is this pair a main coin or not" - one shared list.
main_coin_watch:
  enabled: true
  symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"]
  pct_threshold: 3.0  # both directions
  cooldown_seconds: 1800

# --- 24/7 Market Analyse add-on #5: Meme/Alt Coin 24h% watch ---
# Same idea as main_coin_watch, applied to every pair NOT in
# main_coin_watch.symbols - a much bigger, ASYMMETRIC bar (a meme coin
# dumping is worth flagging sooner than one pumping the same amount).
meme_coin_watch:
  enabled: true
  up_threshold_pct: 40.0
  down_threshold_pct: 30.0
  cooldown_seconds: 1800

# --- 24/7 Market Analyse add-on #6: New/Delisted Token watch ---
# Compares each tick's token list against the previous tick's - any
# rawSymbol that's newly present is a new Bitget listing, any that's
# gone is a delisting. The very FIRST tick after a restart only seeds
# the snapshot (nothing to compare against yet) - it never floods
# every currently-listed pair as "new" on startup.
token_listing_watch:
  enabled: true

# --- Phase 2.2: "Find Strong Signal" 24/7 scanner ---
strong_signal_watch:
  # How often to re-run a full market scan while this mode is ON.
  scan_interval_seconds: 300
  # Only push a signal to the user once its confidence is at/above this.
  min_confidence_to_push: 80
  worker_count: 8
  # Don't push the exact same pair+verdict again within this window.
  cooldown_seconds: 3600
  # --- pump/reversal SELL-bias add-on ---
  # How far back (in daily snapshots) to look when judging a
  # "cumulative" pump - a single 24h ticker figure can't see a move
  # that built up over several days.
  pump_window_days: 5
  # Trailing cumulative % gain that marks a pair as overextended and
  # worth watching for a reversal (per the spec: 80-100%+ pumps).
  pump_threshold_pct: 80.0
  # How often to re-check flagged pairs for a reversal - cheap (token
  # list + occasional order-flow calls only), so this can run much
  # more often than a full scan.
  pump_check_interval_seconds: 60
  # % drop from the peak price (since being flagged) that counts as
  # "starting to reverse".
  reversal_drop_pct: 15.0
  # Live order flow's sell-side % must be at/above this to CONFIRM a
  # reversal once the price drop threshold is hit (if order flow is
  # unavailable, the price drop alone is treated as sufficient).
  reversal_sell_flow_pct: 55.0
  # Trade plan levels for a pump-reversal SELL signal (there's no
  # normal indicator-based trade plan for these - they come from
  # price/order-flow, not engine.signal_scanner). Entry = current
  # price. Stop-loss sits above the PEAK (not just above entry) - a
  # push back above the peak fully invalidates the reversal thesis.
  # TP1/2/3 are simple measured-move %s below entry.
  pump_reversal_sl_buffer_above_peak_pct: 3.0
  pump_reversal_tp1_pct: 5.0
  pump_reversal_tp2_pct: 10.0
  pump_reversal_tp3_pct: 15.0

  # --- Early Momentum Watch add-on (point 2 of the "Find 24/7 Strong
  # Signal" upgrade) ---
  # Pairs that scored below weak_confidence_ceiling in the last full
  # scan get re-checked on their OWN faster schedule
  # (early_watch_interval_seconds), independent of the full scan's own
  # scan_interval_seconds - a real move often starts on a pair the
  # full scan just rated unremarkable, and waiting for the NEXT full
  # scan could mean missing the early part of it. This is a cheap
  # ticker-price-only check (no candles/indicators/order-flow), not a
  # second full scan - it's a heads-up to go look closer (Search
  # Signal / Single Pair Analyse), not a full Strong Signal itself.
  weak_confidence_ceiling: 30
  early_watch_interval_seconds: 240
  # How far back to compare the current price against.
  early_watch_lookback_seconds: 900
  # % move (either direction) within early_watch_lookback_seconds that
  # counts as "this quiet pair just wasn't quiet anymore".
  early_watch_move_pct_threshold: 6.0
  early_watch_cooldown_seconds: 1800

# --- Phase 2.3: "Search Signal" one-shot scan ---
search_signal:
  worker_count: 8
  top_n: 3

# --- Wallet Balance / Money Management add-on ---
# Position size + leverage suggestion attached to every signal
# (Search Signal, Find Strong Signal, Single Pair Analyse), computed
# from the balance the user typed into the "Wallet Balance" button -
# see engine/risk_manager.py for the formula and bot/state_store.py
# for where the balance itself lives. NOT financial advice or a
# guarantee - it's a fixed-risk-per-trade calculator: it sizes the
# position so a stop-loss hit costs a fixed, known % of the wallet.
money_management:
  # % of the stored wallet balance risked if the stop-loss is hit.
  risk_pct_per_trade: 2.0
  # Never suggest below this leverage, even on pairs with a very tight
  # stop (where the pure risk-% formula alone would ask for less).
  min_leverage: 3
  # Safety ceiling - never suggest above this, no matter how far the
  # formula's own math would want to go.
  max_leverage: 20
  # Optional per-pair floor overrides, e.g.:
  #   min_leverage_by_pair:
  #     "BTC/USDT": 5
  #     "ETH/USDT": 5
  # Falls back to min_leverage above for any pair not listed here.
  min_leverage_by_pair: {}

symbols:
  watchlist:
    - "BTCUSDT"
    - "ETHUSDT"

# Automatically checks whether each signal's real Entry/SL/TP1-3 levels
# actually got hit, using live candle data - powers the "📊 Signal
# Outcomes" button. Runs globally (not per-chat, no on/off toggle in
# the bot itself - just this one enabled flag).
signal_outcome_tracker:
  enabled: true
  poll_interval_seconds: 300  # 5 minutes

# --- Anti-sleep / status heartbeat (Render free-tier keep-alive) ---
# The health-check server (bot/main.py) already keeps the process
# awake at the HTTP level when an uptime monitor hits it - this adds a
# VISIBLE hourly confirmation on top of that: a Telegram message sent
# to chat_id proving the bot never slept, plus a live snapshot of
# everything running 24/7 right now (see jobs/heartbeat.py).
# chat_id is left blank here on purpose - set HEARTBEAT_CHAT_ID in
# .env instead (a personal chat id doesn't belong in a file that's
# safe to commit); bot/main.py copies it in at startup. Heartbeat
# stays silent (no-op, no error) if that's left unset.
heartbeat:
  enabled: true
  interval_seconds: 3600  # 1 hour
  chat_id: null


logging:
  level: "INFO"
  log_to_file: true
  log_file_path: "logs/bot_log.txt"